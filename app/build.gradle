plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ftrez.modelswap'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.ftrez.modelswap'
        minSdk 27
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
        buildConfigField 'String', 'TARGET_PACKAGE', '"com.pi.czrxdfirst"'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                        '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'ModelSwap'
            }
        }
    }

    buildFeatures { buildConfig true }
    sourceSets {
        main {
            // One editable source of game mappings; packaged as assets/config.json.
            assets.srcDir rootProject.file('resources')
        }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildTypes {
        debug {
            debuggable false
            jniDebuggable false
        }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}

def defaultModelConfig = rootProject.file('resources/config.json')
def verifyDefaultModelConfig = tasks.register('verifyDefaultModelConfig') {
    inputs.file(defaultModelConfig)
    doLast {
        if (!defaultModelConfig.isFile() || defaultModelConfig.length() == 0
                || defaultModelConfig.length() > 1024 * 1024) {
            throw new GradleException('resources/config.json must exist and contain 1 to 1048576 bytes')
        }
    }
}
tasks.named('preBuild').configure { dependsOn verifyDefaultModelConfig }
